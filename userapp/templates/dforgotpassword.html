<!DOCTYPE html>
<html dir="ltr" lang="en">
  {% load static %}
<head>
{% include 'uhead.html' %}
</head>
<body class="" data-bg-img="images/pattern/p2.png">
<div class="body-overlay"></div>

<div id="wrapper" class="clearfix">
  {% include 'upreloader.html' %}
 
  
  <div class="main-content">
 
<!-- ======================================== start ====================================================== -->

<section id="home" class="divider parallax fullscreen layer-overlay overlay-dark-9" data-bg-img="{% static 'images/bg/bg1.jpg' %}">
  <div class="display-table">
    <div class="display-table-cell">
      <div class="container">
        <div class="row">
          <div class="col-md-6 col-md-push-3">
            <div class="text-center mb-60"><a href="/" class=""><img alt="" src="{% static 'images/logo1.png' %}" style="height: 100px; width: 300px; border-radius: 10px;"></a></div>
            <h4 class="text-theme-colored mt-0 pt-5" style="margin-left: 100px;font-size: 30px;"> Doctor Forgot Password</h4>
            
            <hr>
            <form name="login-form" class="form-transparent clearfix" enctype="multipart/form-data" method="POST" >
              {% csrf_token %}
              
              <div class="row">
                <div class="form-group col-md-12">
                  <label for="form_username_email">Contact Number</label>
                  <input oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10);" pattern="[0-9]{10}" title="Ex.9876543210" required id="form_username_email" name="d_contact" placeholder="Enter Contact Number" class="form-control" type="text">
                </div>
              </div>
            
              <div class="clear text-center pt-10">
                <button class="btn btn-dark btn-lg btn-block no-border" type="submit" data-bg-color="#00acee">Submit</button>
              </div>
              <br>
              {% if msg != "" %}
                <div class="alert alert-danger" role="alert">
                  {{msg}}
                </div>
                {% endif %}
                 
              <div class="clear text-center pt-10">
                <a class="text-theme-colored font-weight-600 font-12" href="/doctorapp/dlogin" target="_blank">Sign In</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>



<!-- ======================================== end ====================================================== -->

  </div>
  
   {% include 'ufooter.html' %}
 
</div>
<script>
  function myFunction() {
    var x = document.getElementById("myInput");
    if (x.type === "password") {
      x.type = "text";
    } else {
      x.type = "password";
    }
  }
  </script>
{% include 'uscript.html' %}
</body>
</html>
