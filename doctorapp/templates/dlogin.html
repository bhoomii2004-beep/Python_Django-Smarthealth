
<!doctype html>
<html lang="en">
  <!-- [Head] start -->
<head>
{% load static %}  
{% include 'dhead.html' %}  

</head>

  <body data-pc-preset="preset-1" data-pc-sidebar-caption="true" data-pc-direction="ltr" data-pc-theme="light">
    <!-- [ Pre-loader ] start -->
<div class="loader-bg">
  <div class="loader-track">
    <div class="loader-fill"></div>
  </div>
</div>
<!-- [ Pre-loader ] End -->

    <div class="auth-main">
      <div class="auth-wrapper v1">
        <div class="auth-form">
          <div class="position-relative">
            <div class="auth-bg">
              <span class="r"></span>
              <span class="r s"></span>
              <span class="r s"></span>
              <span class="r"></span>
            </div>
            <div class="card mb-0">
            
              <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                  {% csrf_token %}
                <div class="text-center">
                  <img src="{% static 'assets/images/logo1.png' %}" alt="img" style="height: 100px; width: 80%;" />
                </div>
                <h4 class="text-center f-w-500 mt-4 mb-3" style="font-size: larger;">Doctor Login</h4>
                <div class="mb-3">
                  <input type="text" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10);" pattern="[0-9]{10}" title="Ex.9876543210" required name="d_contact" class="form-control" id="floatingInput" placeholder="Username" />
                </div>
                <div class="mb-3">
                  <input type="password" id="myInput" name="d_password" class="form-control" id="floatingInput1" placeholder="Password" required />
                </div>
                <div class="d-flex mt-1 justify-content-between align-items-center">
                  <div class="form-check">
                    <input class="form-check-input input-primary" type="checkbox" onclick="myFunction()" id="customCheckc1"  />
                    <label class="form-check-label text-muted" for="customCheckc1">Show Password</label>
                  </div>
                  </div>

                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-primary shadow px-sm-4">Login</button>
                </div>
               
                <br>
                <a style="margin-left: 50px;" class="text-theme-colored font-weight-600 font-12" href="/dforgotpassword">Forgot Your Password?</a>

                {% if msg != "" %}
                <div class="alert alert-danger" role="alert">
                  {{msg}}
                </div>
                {% endif %}
                
              </form>
              </div>
            
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- [ Main Content ] end -->
    <script>
      function myFunction() {
        var x = document.getElementById("myInput");
        if (x.type === "password") {
          x.type = "text";
        } else {
          x.type = "password";
        }
      }
      </script>

{% include 'dscript.html' %}  
</body>
</html>
